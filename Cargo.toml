[package]
name = "focus-island"
version = "1.0.0"
edition = "2021"
description = "Focus Island · 桌面倒计时应用，灵动岛形态的专注计时器"
license = "MIT"

[dependencies]
# tao：窗口管理（透明 / 置顶 / 点击穿透 / 多显示器）
tao = "0.37"
# wry：内嵌 WebView2 渲染前端界面
wry = { version = "0.53", default-features = false, features = ["os-webview"] }
# tray-icon：系统托盘常驻
tray-icon = { version = "0.25", default-features = false }
# serde：状态持久化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# WKWebView transparency and AppKit helpers use the versions already in Cargo.lock.
wry = { version = "0.53", default-features = false, features = ["os-webview", "transparent"] }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSColor", "NSResponder", "NSEvent", "NSGraphics", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSBundle", "NSError", "NSGeometry", "NSString"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationTrigger", "UNNotificationRequest", "UNUserNotificationCenter"] }
block2 = "=0.6.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
