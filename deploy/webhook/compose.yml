name: focus-island-webhook
services:
  gateway:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    # Linux host networking reaches the SSH listener on the host's loopback.
    network_mode: host
    environment:
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN:?Set WEBHOOK_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  caddy_data:
  caddy_config:
